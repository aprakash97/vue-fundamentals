<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Playground</title>
</head>
<body>
    <h1>Hello Vue</h1>
    <div id="app">
      <p v-if="message.length % 2 === 0"> Odd: {{message}} </p>
      <p v-else> Even: {{message}}</p>  
      <ul>
        <li v-for="number in listOfNumbers"> {{number}}</li>
      </ul>
       <p>{{count}}</p>
       <button v-on:click="incrementCount">Increment Counter</button>
    </div>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script>
        const {createApp} = Vue
        const app = createApp({
            data(){
                return{
                    message: 'Hello it works!',
                    listOfNumbers: [1,2,3,4,5],
                    count: 1,
                }
            },
            methods:{
                incrementCount(){
                    this.count++
                }
            }
        })

        app.mount('#app')
    </script>
</body>
</html>
